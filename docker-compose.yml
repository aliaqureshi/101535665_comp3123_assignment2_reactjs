services:
  mongo:
    image: mongo:7
    container_name: comp3123-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - comp3123-network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: comp3123-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8082:8081"
    networks:
      - comp3123-network

  backend:
    build:
      context: ./backend
    container_name: comp3123-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/comp3123_assignment2
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - comp3123-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: comp3123-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - comp3123-network

volumes:
  mongo_data:
  uploads_data:
  logs_data:

networks:
  comp3123-network:
    driver: bridge
